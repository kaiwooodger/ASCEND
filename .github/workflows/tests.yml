name: ASCEND CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "validation/**", "analysis/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONHASHSEED: "0"
  ASCEND_GIT_COMMIT: ${{ github.sha }}

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - run: python -m pytest -q

  dicom:
    name: DICOM tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - run: >-
          python -m pytest -q
          tests/test_dicom_and_geometry.py
          tests/test_roi_inventory.py
          tests/test_anisotropic_layer1.py
          tests/test_anisotropic_layer21.py
          tests/test_anisotropic_layer22_scope.py

  quality:
    name: Lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[quality]'
      - run: python -m compileall -q ascend
      - run: python tools/audit_repository_boundary.py
      - run: ruff check ascend tests tools
      - run: mypy ascend/models/status.py ascend/treatment/models.py ascend/validation/provenance.py
      - run: check-jsonschema --check-metaschema validation/validation_schema.json configs/parameter_schema.json
      - run: check-jsonschema --builtin-schema vendor.citation-file-format CITATION.cff
      - run: check-jsonschema --builtin-schema github-workflows .github/workflows/*.yml
      - run: check-jsonschema --builtin-schema github-issue-forms .github/ISSUE_TEMPLATE/bug.yml .github/ISSUE_TEMPLATE/validation.yml
      - run: for file in validation/*.json configs/*.json; do python -m json.tool "$file" >/dev/null; done
